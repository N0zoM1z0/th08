name: Portable Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: th08-portable-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-i386:
    name: Build Linux i386 package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate launcher scripts
        run: bash -n scripts/*modern-linux*.sh

      - name: Build in the repository i386 environment
        run: scripts/build-modern-linux-container.sh

      - name: Verify ELF architecture and fixed layout
        run: scripts/verify-modern-linux.sh build/modern-linux-container/th08-modern

      - name: Create portable archive
        run: scripts/package-modern-linux.sh build/modern-linux-container/th08-modern

      - name: Record archive checksum
        working-directory: build
        run: sha256sum th08-modern-linux-i386.tar.gz > th08-modern-linux-i386.tar.gz.sha256

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v4
        with:
          name: th08-modern-linux-i386
          path: |
            build/th08-modern-linux-i386.tar.gz
            build/th08-modern-linux-i386.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-linux-x86_64:
    name: Build Linux x86_64 package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate native-layout scripts
        run: |
          bash -n scripts/*portable-linux*.sh
          bash -n scripts/audit-render-replay-linux.sh

      - name: Install x86_64 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libfontconfig1-dev libgl-dev

      - name: Build and verify native-layout ELF
        run: scripts/build-portable-linux.sh x86_64

      - name: Create portable archive
        run: |
          scripts/package-portable-linux.sh \
            build/portable-linux-x86_64/th08-modern \
            x86_64

      - name: Record archive checksum
        working-directory: build
        run: |
          sha256sum th08-portable-linux-x86_64.tar.gz \
            > th08-portable-linux-x86_64.tar.gz.sha256

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v4
        with:
          name: th08-portable-linux-x86_64
          path: |
            build/th08-portable-linux-x86_64.tar.gz
            build/th08-portable-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-linux-aarch64:
    name: Build Linux aarch64 package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
    steps:
      - name: Bootstrap checkout dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git

      - uses: actions/checkout@v7

      - name: Validate native-layout scripts
        run: bash -n scripts/*portable-linux*.sh

      - name: Install AArch64 cross-development libraries
        run: |
          . /etc/os-release
          native_arch="$(dpkg --print-architecture)"
          sed -i \
            -e '/^Architectures:/d' \
            -e "/^Types:/a Architectures: ${native_arch}" \
            /etc/apt/sources.list.d/ubuntu.sources
          tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils cmake file g++-aarch64-linux-gnu ninja-build pkg-config python3 \
            libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64 \
            libfontconfig1-dev:arm64 libgl-dev:arm64

      - name: Build and verify native-layout ELF
        run: scripts/build-portable-linux.sh aarch64

      - name: Create portable archive
        run: |
          scripts/package-portable-linux.sh \
            build/portable-linux-aarch64/th08-modern \
            aarch64

      - name: Record archive checksum
        working-directory: build
        run: |
          sha256sum th08-portable-linux-aarch64.tar.gz \
            > th08-portable-linux-aarch64.tar.gz.sha256

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v4
        with:
          name: th08-portable-linux-aarch64
          path: |
            build/th08-portable-linux-aarch64.tar.gz
            build/th08-portable-linux-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
