schema_version = 1
target_sha256 = "330fbdbf58a710829d65277b4f312cfbb38d5448b3df523e79350b879213d924"

# Recommendations are compiler-shaping hypotheses only. They never mutate
# source or tracking state and never substitute for strict function comparison.

[[rules]]
id = "vc7-explicit-unsigned-narrowing"
requires = ["movzx"]
confidence = "instruction_semantics"
recommendation = "Preserve an unsigned byte/word source or explicit narrowing when a VC7 probe must retain target movzx behavior."
evidence = "x86 movzx operand width in the hash-attested TH08 target"

[[rules]]
id = "vc7-explicit-signed-narrowing"
requires = ["movsx"]
confidence = "instruction_semantics"
recommendation = "Preserve a signed byte/word source or explicit narrowing when a VC7 probe must retain target movsx behavior."
evidence = "x86 movsx operand width in the hash-attested TH08 target"

[[rules]]
id = "vc7-debug-register-home"
requires = ["register_home"]
confidence = "target_observation"
recommendation = "Treat an ECX home only as evidence that incoming ECX was saved. Use the decorated symbol, ledger ABI, and call sites to distinguish a this receiver from fastcall argument zero; preserve real parameter flow and validate shaping with the canonical comparator."
evidence = "Exact TH08 corpus: ItemManager::AutoCollectAllItems 0x004413E0 plus fastcall callbacks Gui::AddedCallback 0x00437A2F, ScreenEffect::AddedCallback 0x0045C0E0, and BulletManager::DeletedCallback 0x00433820"

[[rules]]
id = "vc7-nonfolded-idiv"
requires = ["idiv"]
confidence = "probe_hypothesis"
recommendation = "If a literal division folds away in VC7, probe a semantically real local or field source; accept only an exact comparator result."
evidence = "VC7 code-generation hypothesis constrained by a target-observed idiv"

[[rules]]
id = "vc7-explicit-empty-constructor-definition"
requires = ["implicit_constructor", "missing_function_aux"]
confidence = "exact_match_corpus"
recommendation = "When natural implicit member construction already produces the target bytes but the COFF symbol lacks a function-definition auxiliary record, use a declared out-of-line empty constructor so the comparator can track the function without replacing compiler-driven member initialization."
evidence = "Exact TH08 constructors at 0x00402130, 0x00402150, 0x00402190, and 0x004021D0"

[[rules]]
id = "vc7-natural-inline-comdat-emission"
requires = ["missing_inline_comdat", "target_tu_evidence"]
confidence = "workflow_guardrail"
recommendation = "Restore a target-proven caller and let its translation unit emit a header-inline COMDAT naturally. Do not add dummy callers, artificial function-pointer references, or noinline annotations solely to create a comparator symbol."
evidence = "TH08 GameManager inline cluster 0x00406C70-0x00406DD0 and Rng accessor cluster 0x00453BE0-0x00453C20"
