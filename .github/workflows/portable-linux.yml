name: Portable Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: th08-portable-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-i386:
    name: Build Linux i386 package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate launcher scripts
        run: bash -n scripts/*modern-linux*.sh

      - name: Build in the repository i386 environment
        run: scripts/build-modern-linux-container.sh

      - name: Verify ELF architecture and fixed layout
        run: scripts/verify-modern-linux.sh build/modern-linux-container/th08-modern

      - name: Create portable archive
        run: scripts/package-modern-linux.sh build/modern-linux-container/th08-modern

      - name: Record archive checksum
        working-directory: build
        run: sha256sum th08-modern-linux-i386.tar.gz > th08-modern-linux-i386.tar.gz.sha256

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v4
        with:
          name: th08-modern-linux-i386
          path: |
            build/th08-modern-linux-i386.tar.gz
            build/th08-modern-linux-i386.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  build-linux-64:
    name: Build Linux ${{ matrix.arch }} package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Validate native-layout scripts
        run: bash -n scripts/*portable-linux*.sh

      - name: Install x86_64 development libraries
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libfontconfig1-dev libgl-dev

      - name: Install AArch64 cross-development libraries
        if: matrix.arch == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            g++-aarch64-linux-gnu ninja-build pkg-config \
            libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64 \
            libfontconfig1-dev:arm64 libgl-dev:arm64

      - name: Build and verify native-layout ELF
        run: scripts/build-portable-linux.sh "${{ matrix.arch }}"

      - name: Create portable archive
        run: |
          scripts/package-portable-linux.sh \
            "build/portable-linux-${{ matrix.arch }}/th08-modern" \
            "${{ matrix.arch }}"

      - name: Record archive checksum
        working-directory: build
        run: |
          sha256sum "th08-portable-linux-${{ matrix.arch }}.tar.gz" \
            > "th08-portable-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v4
        with:
          name: th08-portable-linux-${{ matrix.arch }}
          path: |
            build/th08-portable-linux-${{ matrix.arch }}.tar.gz
            build/th08-portable-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
